<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Review — Barry Dell Plumbing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #1c3573; --navy-dark: #142660; --yellow: #f5c500; --yellow-dark: #d4a900; --surface: #f4f5f7; --white: #fff; --muted: #6b7280; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--surface); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .logo { text-decoration: none; display: block; text-align: center; margin-bottom: 2rem; }
    .logo .l1 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--navy); letter-spacing: 0.04em; display: block; }
    .logo .l2 { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; color: var(--yellow-dark); letter-spacing: 0.14em; text-transform: uppercase; display: block; }
    .card { background: var(--white); border-radius: 20px; padding: 2.5rem 2rem; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(28,53,115,0.1); }
    .card h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem; font-weight: 900; color: var(--navy); text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 0.5rem; }
    .card p { color: var(--muted); font-size: 0.9rem; line-height: 1.65; margin-bottom: 2rem; }
    .stars-row { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; }
    .star-btn { background: none; border: none; cursor: pointer; padding: 0.25rem; transition: transform 0.15s; }
    .star-btn:hover { transform: scale(1.2); }
    .star-btn svg { width: 44px; height: 44px; fill: #e5e7eb; transition: fill 0.15s; }
    .star-btn.active svg, .star-btn.hover svg { fill: var(--yellow); }
    .star-label { font-size: 0.82rem; color: var(--muted); min-height: 1.2em; margin-bottom: 1.5rem; font-weight: 500; }
    .back-link { display: inline-block; margin-top: 1.5rem; font-size: 0.8rem; color: var(--muted); text-decoration: none; }
    .back-link:hover { color: var(--navy); }
  </style>
</head>
<body>
  <a href="index.html" class="logo">
    <span class="l1">Barry Dell</span>
    <span class="l2">Plumbing Limited</span>
  </a>
  <div class="card">
    <h1>How Did We Do?</h1>
    <p>Your feedback means everything to us. Tap the stars below to rate your experience with Barry Dell Plumbing.</p>
    <div class="stars-row" id="stars">
      <button class="star-btn" data-rating="1" aria-label="1 star"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>
      <button class="star-btn" data-rating="2" aria-label="2 stars"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>
      <button class="star-btn" data-rating="3" aria-label="3 stars"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>
      <button class="star-btn" data-rating="4" aria-label="4 stars"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>
      <button class="star-btn" data-rating="5" aria-label="5 stars"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>
    </div>
    <div class="star-label" id="star-label">Select your rating</div>
    <a href="index.html" class="back-link">← Back to website</a>
  </div>
  <script>
    const labels = ['', 'Poor', 'Fair', 'Good', 'Great', 'Excellent!'];
    const btns = document.querySelectorAll('.star-btn');
    const label = document.getElementById('star-label');
    btns.forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        const r = parseInt(btn.dataset.rating);
        btns.forEach(b => b.classList.toggle('hover', parseInt(b.dataset.rating) <= r));
        label.textContent = labels[r];
      });
      btn.addEventListener('mouseleave', () => {
        btns.forEach(b => b.classList.remove('hover'));
        label.textContent = 'Select your rating';
      });
      btn.addEventListener('click', () => {
        const r = parseInt(btn.dataset.rating);
        if (r >= 4) {
          window.location.href = 'https://g.page/r/barrydellplumbing/review';
        } else {
          window.location.href = 'private.html?rating=' + r;
        }
      });
    });
  </script>
</body>
</html>
